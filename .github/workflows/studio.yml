name: studio

# Builds platform-mode Studio (studio/build.sh) and runs the headless spike against it, then the remote MCP endpoint end to
# end on the amd64 build (mcp-e2e). Public-repo runners have 4 vCPU and 16 GB RAM; ci-prepare.sh adds swap and frees disk.
#
# The workflow starts on every push, and the `changes` job decides what runs: the build (and the spike) only when the push
# touched Studio, its pin or this file, as the path filter this replaces did; mcp-e2e when the push touched Studio or
# anything the endpoint depends on (the API server, the proxy, the fleet, the OAuth walk), and always on main, so that the
# release gate (deploy/release-gate.sh) finds a run of both on the tagged commit; ai-e2e when the push touched Studio or
# anything the AI Assistant's provider depends on (the API server, the fleet, the config, `supavise studio ai`, its script),
# and on a manual run. When the build did not run, mcp-e2e and ai-e2e take the amd64 build of the newest successful run of
# this branch or of main that pins the same Studio file (tests/linux/crawl/fetch-studio.sh), which is the same code.
on:
  push:
    branches: [main, "ws/**", "integrate/**"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read   # gh run download of an earlier build

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.c.outputs.run }}
      studio: ${{ steps.c.outputs.studio }}
      ai: ${{ steps.c.outputs.ai }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: c
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          tests/linux/crawl/changes.sh \
            'studio=^(studio/|internal/versions/versions\.yaml$|\.github/workflows/studio\.yml$)' \
            'mcp=^(internal/(api|proxy|fleet|oauth)/|internal/branching/testdata/|tests/linux/(oauth/|oauth-smoke\.sh|lib\.sh))' \
            'ai=^(internal/(api|fleet|config)/|cmd/supavise/cmd_studio_ai|tests/linux/(ai/|ai-smoke\.sh|lib\.sh))' \
            | tee -a "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.studio == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, platform: linux-amd64 }
          - { runner: ubuntu-24.04-arm, platform: linux-arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: prepare runner
        run: sudo env SUPAVISE_CI=1 studio/ci-prepare.sh   # sudo drops GITHUB_ACTIONS from the environment
      - name: build
        run: studio/build.sh ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: studio-${{ matrix.platform }}
          path: studio/dist/
      - name: spike
        run: studio/spike.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-spike-${{ matrix.platform }}
          path: studio/.build-cache/spike/out
          if-no-files-found: ignore

  # The remote MCP endpoint end to end, on the Studio build the `build` job just made (amd64), or on the newest matching one (this branch's or main's)
  # when this push did not build Studio: the same walk as the `oauth-smoke` job of linux.yml (tests/linux/oauth-smoke.sh) with
  # Studio running from the artifact, plus step L-09: MCP over Streamable HTTP at /mcp with two protocol revisions, a
  # project-scoped and an account-scoped URL, read_only, features, a personal access token as bearer, get_project_url and
  # create_project, and the six branch tools (create_branch, list_branches, rebase_branch, merge_branch, reset_branch,
  # delete_branch) on an account-scoped URL and a project-scoped URL bound to a branch. `!cancelled()` runs it when only the
  # spike (or the arm64 build) failed; a missing amd64 artifact fails the download step. The release gate requires this job
  # (deploy/release-gate.sh: studio.yml:mcp-e2e).
  mcp-e2e:
    needs: [changes, build]
    if: ${{ !cancelled() && needs.changes.outputs.run == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: needs.build.result != 'skipped'
        uses: actions/download-artifact@v4
        with:
          name: studio-linux-amd64
          path: /tmp/studio-dist
      - if: needs.build.result == 'skipped'
        name: Studio build of main
        env:
          GH_TOKEN: ${{ github.token }}
        run: tests/linux/crawl/fetch-studio.sh /tmp/studio-dist
      - name: build supavise
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/supavise ./cmd/supavise
      - name: mcp end to end
        run: |
          ls -l /tmp/studio-dist
          sudo env "PATH=$PATH" LOG_DIR=/tmp/supavise-mcp-logs SUPAVISE_BIN=/tmp/supavise \
            tests/linux/oauth-smoke.sh --studio-artifact "$(ls /tmp/studio-dist/supavise-studio-*-linux-amd64.tar.zst)"
      - if: always()
        name: collect logs
        run: sudo chmod -R a+rX /tmp/supavise-mcp-logs || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-e2e
          path: /tmp/supavise-mcp-logs
          if-no-files-found: ignore

  # The AI Assistant with a provider the operator brings, on the amd64 Studio build (the `build` job's, or the
  # newest earlier one as in mcp-e2e): tests/linux/ai-smoke.sh points Supavise at a fake OpenAI-compatible provider
  # on loopback with a dummy key (`supavise studio ai set`) and calls Studio's routes through the edge with a
  # dashboard session. It proves that the base URL, the key and the model are the ones used, that what the provider
  # is told follows the organization's AI opt-in, that nothing goes to api.openai.com, and that the key is in
  # Studio's environment file and nowhere else. It costs no second Studio build; `!cancelled()` runs it when only the
  # spike (or the arm64 build) failed. It runs when the push touched Studio (`studio`) or the `ai` paths of the
  # `changes` job, and on a manual run; it is not on the release gate (deploy/release-gate.sh).
  ai-e2e:
    needs: [changes, build]
    if: ${{ !cancelled() && (needs.changes.outputs.ai == 'true' || needs.changes.outputs.studio == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - if: needs.build.result != 'skipped'
        uses: actions/download-artifact@v4
        with:
          name: studio-linux-amd64
          path: /tmp/studio-dist
      - if: needs.build.result == 'skipped'
        name: Studio build of main
        env:
          GH_TOKEN: ${{ github.token }}
        run: tests/linux/crawl/fetch-studio.sh /tmp/studio-dist
      - name: build supavise
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/supavise ./cmd/supavise
      - name: ai end to end
        run: |
          ls -l /tmp/studio-dist
          sudo env "PATH=$PATH" LOG_DIR=/tmp/supavise-ai-logs SUPAVISE_BIN=/tmp/supavise \
            tests/linux/ai-smoke.sh --studio-artifact "$(ls /tmp/studio-dist/supavise-studio-*-linux-amd64.tar.zst)"
      - if: always()
        name: collect logs
        run: sudo chmod -R a+rX /tmp/supavise-ai-logs || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-e2e
          path: /tmp/supavise-ai-logs
          if-no-files-found: ignore
